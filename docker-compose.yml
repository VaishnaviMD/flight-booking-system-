services:
  postgres:
    image: postgres:15-alpine
    container_name: flightbooking-db
    environment:
      POSTGRES_DB: flightbooking
      POSTGRES_USER: flightadmin
      POSTGRES_PASSWORD: flight@2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightadmin -d flightbooking"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
