# ============================================================
# DEV PROFILE — No PostgreSQL or Docker needed
# Runs with H2 in-memory database (data resets on restart)
# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:flightbooking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — auto create tables from entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable Flyway (H2 uses JPA schema generation instead)
spring.flyway.enabled=false

# H2 console — view data at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail — disabled in dev
spring.mail.host=localhost
spring.mail.port=25
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
