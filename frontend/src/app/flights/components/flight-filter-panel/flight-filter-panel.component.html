<div class="card" style="background: var(--surface-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; box-shadow: var(--shadow);">
  
  <!-- Header -->
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px;">
    <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px;">
      <span class="material-icons" style="font-size: 20px; color: var(--accent-color);">tune</span> Filter Results
    </h3>
    <button (click)="resetFilters()" style="background: transparent; border: none; color: var(--accent-color); font-weight: 600; font-size: 0.85rem; cursor: pointer;">
      Reset All
    </button>
  </div>

  <!-- Sort By -->
  <div style="margin-bottom: 20px;">
    <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px;">SORT BY</label>
    <select [(ngModel)]="state.sortBy" (change)="emitChange()" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--surface-card); color: var(--text-main); font-weight: 600; font-size: 0.9rem;">
      <option value="PRICE_LOW">Lowest Price</option>
      <option value="PRICE_HIGH">Highest Price</option>
      <option value="DEPARTURE_TIME">Departure Time</option>
      <option value="DURATION">Duration</option>
    </select>
  </div>

  <!-- Max Price Range -->
  <div style="margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: var(--text-main);">
      <span>Max Price</span>
      <span style="color: var(--accent-color);">₹{{ state.maxPrice | number }}</span>
    </div>
    <input 
      type="range" 
      min="2000" 
      [max]="maxPriceLimit" 
      step="250" 
      [(ngModel)]="state.maxPrice" 
      (input)="emitChange()"
      style="width: 100%; accent-color: var(--accent-color);" />
  </div>

  <!-- Stops Filter Buttons -->
  <div style="margin-bottom: 20px;">
    <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px;">STOPS</label>
    <div style="display: flex; gap: 6px;">
      <button 
        (click)="setStops('ALL')"
        [style.background]="state.stops === 'ALL' ? 'var(--accent-color)' : 'var(--surface-card)'"
        [style.color]="state.stops === 'ALL' ? '#ffffff' : 'var(--text-main)'"
        style="flex: 1; border: 1px solid var(--border-color); padding: 8px 4px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer;">
        Any
      </button>
      <button 
        (click)="setStops('NONSTOP')"
        [style.background]="state.stops === 'NONSTOP' ? 'var(--accent-color)' : 'var(--surface-card)'"
        [style.color]="state.stops === 'NONSTOP' ? '#ffffff' : 'var(--text-main)'"
        style="flex: 1; border: 1px solid var(--border-color); padding: 8px 4px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer;">
        Direct
      </button>
      <button 
        (click)="setStops('ONE_STOP')"
        [style.background]="state.stops === 'ONE_STOP' ? 'var(--accent-color)' : 'var(--surface-card)'"
        [style.color]="state.stops === 'ONE_STOP' ? '#ffffff' : 'var(--text-main)'"
        style="flex: 1; border: 1px solid var(--border-color); padding: 8px 4px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer;">
        1 Stop
      </button>
    </div>
  </div>

  <!-- Airlines Filter -->
  <div>
    <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px;">AIRLINES</label>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label *ngFor="let a of airlines" style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-main); cursor: pointer;">
        <input 
          type="checkbox" 
          [checked]="state.selectedAirlines.includes(a.code)" 
          (change)="onAirlineToggle(a.code, $event)"
          style="accent-color: var(--accent-color); width: 16px; height: 16px;" />
        <span>{{ a.name }} ({{ a.code }})</span>
      </label>
    </div>
  </div>

</div>
