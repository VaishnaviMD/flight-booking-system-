<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SkyFlow — Modern Flight Booking System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <script>
    // Apply the persisted theme before Angular bootstraps to avoid a flash
    // of the wrong theme. Dark is the default when nothing is stored.
    try {
      if (localStorage.getItem('skyflow_theme') === 'light') {
        document.body.classList.add('light-theme');
      }
    } catch (e) { /* keep default dark */ }
  </script>
</body>
</html>
